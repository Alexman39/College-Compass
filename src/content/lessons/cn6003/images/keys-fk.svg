<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 274" width="500" height="274" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Πρωτεύον και ξένο κλειδί</title>
  <defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0c2636"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e7d32"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c62828"/></marker><marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#841387"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7b8a94"/></marker></defs>
  <rect width="500" height="274" fill="#ffffff"/>
  <text x="250" y="30" text-anchor="middle" font-size="16" font-weight="800" fill="#0c2636">Πρωτεύον κλειδί ↔ ξένο κλειδί</text>
  <text x="120" y="70" text-anchor="middle" font-size="13" font-weight="800" fill="#0c2636" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">teacher</text>
  <rect x="40" y="78" width="160" height="28" rx="0" fill="#f3e6f4" stroke="#841387" stroke-width="2"/>
  <text x="50" y="96" text-anchor="start" font-size="12.5" font-weight="700" fill="#0c2636" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">am</text>
  <text x="190" y="96" text-anchor="end" font-size="10.5" font-weight="800" fill="#841387">PK</text>
  <rect x="40" y="106" width="160" height="28" rx="0" fill="#eef3f6" stroke="#7b8a94" stroke-width="1"/>
  <text x="50" y="124" text-anchor="start" font-size="12.5" font-weight="400" fill="#0c2636" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">surname</text>
  <rect x="40" y="134" width="160" height="28" rx="0" fill="#eef3f6" stroke="#7b8a94" stroke-width="1"/>
  <text x="50" y="152" text-anchor="start" font-size="12.5" font-weight="400" fill="#0c2636" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">speciality</text>
  <text x="380" y="70" text-anchor="middle" font-size="13" font-weight="800" fill="#0c2636" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">course</text>
  <rect x="300" y="78" width="160" height="28" rx="0" fill="#f3e6f4" stroke="#841387" stroke-width="2"/>
  <text x="310" y="96" text-anchor="start" font-size="12.5" font-weight="700" fill="#0c2636" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">id</text>
  <text x="450" y="96" text-anchor="end" font-size="10.5" font-weight="800" fill="#841387">PK</text>
  <rect x="300" y="106" width="160" height="28" rx="0" fill="#eef3f6" stroke="#7b8a94" stroke-width="1"/>
  <text x="310" y="124" text-anchor="start" font-size="12.5" font-weight="400" fill="#0c2636" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">title</text>
  <rect x="300" y="134" width="160" height="28" rx="0" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="310" y="152" text-anchor="start" font-size="12.5" font-weight="700" fill="#0c2636" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">c_am</text>
  <text x="450" y="152" text-anchor="end" font-size="10.5" font-weight="800" fill="#2e7d32">FK</text>
  <path d="M300 148 C 250 148, 250 92, 200 92" fill="none" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#a-ok)"/>
  <text x="250" y="82" text-anchor="middle" font-size="11" font-weight="800" fill="#2e7d32">REFERENCES</text>
  <rect x="40" y="198" width="420" height="56" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="250" y="220" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0c2636">Το ξένο κλειδί c_am στον course δείχνει στο πρωτεύον</text>
  <text x="250" y="238" text-anchor="middle" font-size="12.5" font-weight="400" fill="#4a5a65">κλειδί am του teacher — έτσι συνδέονται οι δύο πίνακες.</text>
</svg>
