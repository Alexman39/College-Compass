<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 288" width="500" height="288" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>White, gray και black hat hackers</title>
  <defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0c2636"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e7d32"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c62828"/></marker><marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#841387"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7b8a94"/></marker></defs>
  <rect width="500" height="288" fill="#ffffff"/>
  <text x="250" y="28" text-anchor="middle" font-size="16" font-weight="800" fill="#0c2636">Τα τρία καπέλα των hackers</text>
  <rect x="24" y="50" width="142" height="222" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/>
  <path d="M69.0 94 h52 l6 10 h-64 z" fill="#2e7d32"/>
  <rect x="79.0" y="76" width="32" height="20" rx="4" fill="#2e7d32"/>
  <text x="95" y="128" text-anchor="middle" font-size="15" font-weight="800" fill="#2e7d32">White hat</text>
  <text x="95" y="152" text-anchor="middle" font-size="12" font-weight="700" fill="#0c2636">Με άδεια</text>
  <text x="95" y="200" text-anchor="middle" font-size="11" font-weight="400" fill="#4a5a65">ethical hacker·</text>
  <text x="95" y="214" text-anchor="middle" font-size="11" font-weight="400" fill="#4a5a65">βρίσκει και</text>
  <text x="95" y="228" text-anchor="middle" font-size="11" font-weight="400" fill="#4a5a65">αναφέρει ευπάθειες,</text>
  <text x="95" y="242" text-anchor="middle" font-size="11" font-weight="400" fill="#4a5a65">πληρώνεται νόμιμα</text>
  <rect x="179" y="50" width="142" height="222" rx="12" fill="#fff1d6" stroke="#a15c00" stroke-width="2.5"/>
  <path d="M224.0 94 h52 l6 10 h-64 z" fill="#a15c00"/>
  <rect x="234.0" y="76" width="32" height="20" rx="4" fill="#a15c00"/>
  <text x="250" y="128" text-anchor="middle" font-size="15" font-weight="800" fill="#a15c00">Gray hat</text>
  <text x="250" y="152" text-anchor="middle" font-size="12" font-weight="700" fill="#0c2636">Χωρίς άδεια,</text>
  <text x="250" y="168" text-anchor="middle" font-size="12" font-weight="700" fill="#0c2636">χωρίς κακό σκοπό</text>
  <text x="250" y="200" text-anchor="middle" font-size="11" font-weight="400" fill="#4a5a65">βρίσκει ευπάθειες</text>
  <text x="250" y="214" text-anchor="middle" font-size="11" font-weight="400" fill="#4a5a65">απρόσκλητος· ηθικά</text>
  <text x="250" y="228" text-anchor="middle" font-size="11" font-weight="400" fill="#4a5a65">και νομικά γκρίζα</text>
  <text x="250" y="242" text-anchor="middle" font-size="11" font-weight="400" fill="#4a5a65">ζώνη</text>
  <rect x="334" y="50" width="142" height="222" rx="12" fill="#fdecea" stroke="#c62828" stroke-width="2.5"/>
  <path d="M379.0 94 h52 l6 10 h-64 z" fill="#c62828"/>
  <rect x="389.0" y="76" width="32" height="20" rx="4" fill="#c62828"/>
  <text x="405" y="128" text-anchor="middle" font-size="15" font-weight="800" fill="#c62828">Black hat</text>
  <text x="405" y="152" text-anchor="middle" font-size="12" font-weight="700" fill="#0c2636">Χωρίς άδεια,</text>
  <text x="405" y="168" text-anchor="middle" font-size="12" font-weight="700" fill="#0c2636">κακόβουλος</text>
  <text x="405" y="200" text-anchor="middle" font-size="11" font-weight="400" fill="#4a5a65">παραβιάζει για</text>
  <text x="405" y="214" text-anchor="middle" font-size="11" font-weight="400" fill="#4a5a65">όφελος ή ζημιά·</text>
  <text x="405" y="228" text-anchor="middle" font-size="11" font-weight="400" fill="#4a5a65">είναι παράνομος</text>
</svg>
