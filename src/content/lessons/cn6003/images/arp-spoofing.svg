<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="500" height="360" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>ARP spoofing σε τοπικό δίκτυο</title>
  <defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0c2636"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e7d32"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c62828"/></marker><marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#841387"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7b8a94"/></marker></defs>
  <rect width="500" height="360" fill="#ffffff"/>
  <line x1="165" y1="62" x2="333" y2="62" stroke="#7b8a94" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#a-muted)"/>
  <text x="250" y="46" text-anchor="middle" font-size="15" font-weight="400" fill="#4a5a65">κανονική διαδρομή</text>
  <line x1="110" y1="98" x2="190" y2="222" stroke="#c62828" stroke-width="3" marker-end="url(#a-bad)"/>
  <line x1="310" y1="222" x2="390" y2="98" stroke="#c62828" stroke-width="3" marker-end="url(#a-bad)"/>
  <text x="250" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#c62828">μετά το ARP spoofing</text>
  <rect x="15" y="44" width="150" height="52" rx="10" fill="#eef3f6" stroke="#7b8a94" stroke-width="2.5"/>
  <text x="90" y="76" text-anchor="middle" font-size="17" font-weight="800" fill="#0c2636">Χρήστης</text>
  <rect x="335" y="44" width="150" height="52" rx="10" fill="#eef3f6" stroke="#7b8a94" stroke-width="2.5"/>
  <text x="410" y="76" text-anchor="middle" font-size="17" font-weight="800" fill="#0c2636">Δρομολογητής</text>
  <rect x="175" y="224" width="150" height="52" rx="10" fill="#fdecea" stroke="#c62828" stroke-width="2.5"/>
  <text x="250" y="256" text-anchor="middle" font-size="17" font-weight="800" fill="#0c2636">Επιτιθέμενος</text>
  <text x="250" y="306" text-anchor="middle" font-size="15" font-weight="400" fill="#4a5a65">Ο επιτιθέμενος δηλώνει τη δική του MAC</text>
  <text x="250" y="326" text-anchor="middle" font-size="15" font-weight="400" fill="#4a5a65">ως MAC του δρομολογητή, οπότε η κίνηση</text>
  <text x="250" y="346" text-anchor="middle" font-size="15" font-weight="400" fill="#4a5a65">του χρήστη περνά από αυτόν.</text>
</svg>
