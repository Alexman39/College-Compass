<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 396" width="500" height="396" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Τα επίπεδα ενός συστήματος UNIX</title>
  <defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0c2636"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e7d32"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c62828"/></marker><marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#841387"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7b8a94"/></marker></defs>
  <rect width="500" height="396" fill="#ffffff"/>
  <rect x="30" y="20" width="330" height="62" rx="10" fill="#ffffff" stroke="#7b8a94" stroke-width="2"/>
  <text x="195" y="46" text-anchor="middle" font-size="17" font-weight="800" fill="#0c2636">Χρήστης</text>
  <text x="195" y="68" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5a65">πληκτρολογεί εντολές: ls, cp, chmod …</text>
  <line x1="195" y1="82" x2="195" y2="104" stroke="#0c2636" stroke-width="2.5" marker-end="url(#a-ink)"/>
  <rect x="30" y="104" width="330" height="62" rx="10" fill="#f3e6f4" stroke="#841387" stroke-width="2.5"/>
  <text x="195" y="130" text-anchor="middle" font-size="17" font-weight="800" fill="#0c2636">Φλοιός (shell)</text>
  <text x="195" y="152" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5a65">περιμένει → δέχεται → μεταφράζει → εκτελεί</text>
  <line x1="195" y1="166" x2="195" y2="188" stroke="#0c2636" stroke-width="2.5" marker-end="url(#a-ink)"/>
  <rect x="30" y="188" width="330" height="62" rx="10" fill="#dfe8ee" stroke="#0c2636" stroke-width="2.5"/>
  <text x="195" y="214" text-anchor="middle" font-size="17" font-weight="800" fill="#0c2636">Πυρήνας (kernel)</text>
  <text x="195" y="236" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5a65">διεργασίες, μνήμη, αρχεία, συσκευές</text>
  <line x1="195" y1="250" x2="195" y2="272" stroke="#0c2636" stroke-width="2.5" marker-end="url(#a-ink)"/>
  <rect x="30" y="272" width="330" height="62" rx="10" fill="#eef3f6" stroke="#7b8a94" stroke-width="2"/>
  <text x="195" y="298" text-anchor="middle" font-size="17" font-weight="800" fill="#0c2636">Υλικό</text>
  <text x="195" y="320" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5a65">CPU, RAM, δίσκοι, κάρτα δικτύου</text>
  <line x1="20" y1="177" x2="480" y2="177" stroke="#c62828" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="420" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#841387">user mode</text>
  <text x="420" y="218" text-anchor="middle" font-size="14" font-weight="700" fill="#0c2636">kernel mode</text>
  <text x="420" y="236" text-anchor="middle" font-size="12" font-weight="400" fill="#4a5a65">(μόνο ο πυρήνας)</text>
  <text x="250" y="362" text-anchor="middle" font-size="14" font-weight="400" fill="#4a5a65">Κάθε χρήστης που συνδέεται παίρνει δικό του φλοιό·</text>
  <text x="250" y="382" text-anchor="middle" font-size="14" font-weight="400" fill="#4a5a65">οι εφαρμογές φτάνουν στο υλικό μόνο μέσω του πυρήνα.</text>
</svg>
