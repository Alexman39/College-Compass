  <rect x="156" y="118" width="110" height="44" fill="#e3eefb" stroke="#2a62a8" stroke-width="1.5"/>
  <text x="211" y="139" text-anchor="middle" font-size="13" font-weight="700" fill="#0c2636">Protocol</text>
  <text x="211" y="154" text-anchor="middle" font-size="11" font-weight="400" fill="#4a5a65">8 bit</text>
  <rect x="266" y="118" width="220" height="44" fill="#e3eefb" stroke="#2a62a8" stroke-width="1.5"/>
  <text x="376" y="139" text-anchor="middle" font-size="13" font-weight="700" fill="#0c2636">Header Checksum</text>
  <text x="376" y="154" text-anchor="middle" font-size="11" font-weight="400" fill="#4a5a65">16 bit</text>
  <text x="38" y="189" text-anchor="end" font-size="12" font-weight="600" fill="#4a5a65">12</text>
  <rect x="46" y="162" width="440" height="44" fill="#f3e6f4" stroke="#841387" stroke-width="1.5"/>
  <text x="266" y="183" text-anchor="middle" font-size="13" font-weight="700" fill="#0c2636">Source Address</text>
  <text x="266" y="198" text-anchor="middle" font-size="11" font-weight="400" fill="#4a5a65">32 bit</text>
  <text x="38" y="233" text-anchor="end" font-size="12" font-weight="600" fill="#4a5a65">16</text>
  <rect x="46" y="206" width="440" height="44" fill="#f3e6f4" stroke="#841387" stroke-width="1.5"/>
  <text x="266" y="227" text-anchor="middle" font-size="13" font-weight="700" fill="#0c2636">Destination Address</text>
  <text x="266" y="242" text-anchor="middle" font-size="11" font-weight="400" fill="#4a5a65">32 bit</text>
  <text x="38" y="277" text-anchor="end" font-size="12" font-weight="600" fill="#4a5a65">20</text>
  <rect x="46" y="250" width="440" height="44" fill="#ffffff" stroke="#7b8a94" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="266" y="271" text-anchor="middle" font-size="13" font-weight="700" fill="#0c2636">Options / Padding (προαιρετικά)</text>
  <text x="266" y="286" text-anchor="middle" font-size="11" font-weight="400" fill="#4a5a65">32 bit</text>
  <text x="250" y="316" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5a65">Συνήθως 5 γραμμές × 4 bytes = 20 bytes (IHL = 5)· έως 60 με options.</text>
</svg>
