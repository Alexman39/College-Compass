  <text x="162.875" y="20" text-anchor="middle" font-size="12" font-weight="600" fill="#4a5a65">8</text>
  <text x="272.875" y="20" text-anchor="middle" font-size="12" font-weight="600" fill="#4a5a65">16</text>
  <text x="382.875" y="20" text-anchor="middle" font-size="12" font-weight="600" fill="#4a5a65">24</text>
  <text x="479.125" y="20" text-anchor="middle" font-size="12" font-weight="600" fill="#4a5a65">31</text>
