  <text x="396.625" y="110" text-anchor="middle" font-size="11" font-weight="400" fill="#4a5a65">13 bit</text>
  <text x="38" y="145" text-anchor="end" font-size="12" font-weight="600" fill="#4a5a65">8</text>
  <rect x="46" y="118" width="110" height="44" fill="#e3eefb" stroke="#2a62a8" stroke-width="1.5"/>
