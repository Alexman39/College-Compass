  <text x="73.5" y="66" text-anchor="middle" font-size="11" font-weight="400" fill="#4a5a65">4 bit</text>
  <rect x="101" y="30" width="55" height="44" fill="#e3eefb" stroke="#2a62a8" stroke-width="1.5"/>
