<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 328" width="500" height="328" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Η επικεφαλίδα IPv4 σε γραμμές των 32 bit</title>
  <defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0c2636"/></marker></defs>
  <rect width="500" height="328" fill="#ffffff"/>
