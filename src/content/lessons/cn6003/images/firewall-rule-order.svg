<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 326" width="500" height="326" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Σειρά κανόνων firewall</title>
  <defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0c2636"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e7d32"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c62828"/></marker><marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#841387"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7b8a94"/></marker></defs>
  <rect width="500" height="326" fill="#ffffff"/>
  <text x="130" y="24" text-anchor="middle" font-size="18" font-weight="800" fill="#c62828">Λάθος σειρά</text>
  <rect x="65" y="40" width="130" height="34" rx="17" fill="#ffffff" stroke="#0c2636" stroke-width="2"/>
  <text x="130" y="63" text-anchor="middle" font-size="14" font-weight="700" fill="#0c2636">πακέτο: θύρα 23</text>
  <rect x="20" y="104" width="220" height="46" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/>
  <text x="36" y="133" text-anchor="start" font-size="16" font-weight="800" fill="#4a5a65">1.</text>
  <text x="138" y="133" text-anchor="middle" font-size="16" font-weight="700" fill="#0c2636">Επίτρεψε όλα</text>
  <rect x="20" y="168" width="220" height="46" rx="10" fill="#eef3f6" stroke="#7b8a94" stroke-width="2"/>
  <text x="36" y="197" text-anchor="start" font-size="16" font-weight="800" fill="#4a5a65">2.</text>
  <text x="138" y="197" text-anchor="middle" font-size="16" font-weight="700" fill="#0c2636">Μπλόκαρε θύρα 23</text>
  <line x1="130" y1="76" x2="130" y2="100" stroke="#0c2636" stroke-width="2.5" marker-end="url(#a-ink)"/>
  <text x="130" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#c62828">✓ ταιριάζει ο κανόνας 1</text>
  <text x="130" y="260" text-anchor="middle" font-size="15" font-weight="800" fill="#c62828">→ το πακέτο περνά</text>
  <text x="130" y="282" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5a65">ο κανόνας 2 δεν εξετάζεται</text>
  <text x="370" y="24" text-anchor="middle" font-size="18" font-weight="800" fill="#2e7d32">Σωστή σειρά</text>
  <rect x="305" y="40" width="130" height="34" rx="17" fill="#ffffff" stroke="#0c2636" stroke-width="2"/>
  <text x="370" y="63" text-anchor="middle" font-size="14" font-weight="700" fill="#0c2636">πακέτο: θύρα 23</text>
  <rect x="260" y="104" width="220" height="46" rx="10" fill="#fdecea" stroke="#c62828" stroke-width="3"/>
  <text x="276" y="133" text-anchor="start" font-size="16" font-weight="800" fill="#4a5a65">1.</text>
  <text x="378" y="133" text-anchor="middle" font-size="16" font-weight="700" fill="#0c2636">Μπλόκαρε θύρα 23</text>
  <rect x="260" y="168" width="220" height="46" rx="10" fill="#eef3f6" stroke="#7b8a94" stroke-width="2"/>
  <text x="276" y="197" text-anchor="start" font-size="16" font-weight="800" fill="#4a5a65">2.</text>
  <text x="378" y="197" text-anchor="middle" font-size="16" font-weight="700" fill="#0c2636">Επίτρεψε όλα</text>
  <line x1="370" y1="76" x2="370" y2="100" stroke="#0c2636" stroke-width="2.5" marker-end="url(#a-ink)"/>
  <text x="370" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#2e7d32">✓ ταιριάζει ο κανόνας 1</text>
  <text x="370" y="260" text-anchor="middle" font-size="15" font-weight="800" fill="#2e7d32">→ το πακέτο σταματά</text>
  <text x="370" y="282" text-anchor="middle" font-size="13" font-weight="400" fill="#4a5a65">ο κανόνας 2 δεν εξετάζεται</text>
  <text x="250" y="312" text-anchor="middle" font-size="15" font-weight="400" fill="#4a5a65">Το firewall εφαρμόζει τον πρώτο κανόνα που ταιριάζει.</text>
</svg>
