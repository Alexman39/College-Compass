  <text x="250" y="77" text-anchor="middle" font-size="20" font-weight="800" fill="#0c2636">A</text>
  <text x="250" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#4a5a65">f = 20 + 40 = 60</text>
