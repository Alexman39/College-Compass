<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340" width="500" height="340" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Επέκταση μιας κατάστασης</title>
  <defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0c2636"/></marker><marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#841387"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e7d32"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7b8a94"/></marker></defs>
  <rect width="500" height="340" fill="#ffffff"/>
  <line x1="250" y1="76" x2="110" y2="186" stroke="#841387" stroke-width="2.5" marker-end="url(#a-acc)"/>
  <line x1="250" y1="76" x2="250" y2="186" stroke="#841387" stroke-width="2.5" marker-end="url(#a-acc)"/>
  <line x1="250" y1="76" x2="390" y2="186" stroke="#841387" stroke-width="2.5" marker-end="url(#a-acc)"/>
  <circle cx="250" cy="50" r="26" fill="#f3e6f4" stroke="#841387" stroke-width="3"/>
  <text x="250" y="56" text-anchor="middle" font-size="18" font-weight="800" fill="#0c2636">S</text>
  <text x="290" y="56" text-anchor="start" font-size="15" font-weight="700" fill="#0c2636">κατάσταση (γονέας)</text>
  <circle cx="110" cy="212" r="24" fill="#eef3f6" stroke="#7b8a94" stroke-width="2"/>
  <text x="110" y="218" text-anchor="middle" font-size="16" font-weight="800" fill="#0c2636">S1</text>
  <circle cx="250" cy="212" r="24" fill="#eef3f6" stroke="#7b8a94" stroke-width="2"/>
  <text x="250" y="218" text-anchor="middle" font-size="16" font-weight="800" fill="#0c2636">S2</text>
  <circle cx="390" cy="212" r="24" fill="#eef3f6" stroke="#7b8a94" stroke-width="2"/>
  <text x="390" y="218" text-anchor="middle" font-size="16" font-weight="800" fill="#0c2636">S3</text>
  <text x="24" y="120" text-anchor="start" font-size="15" font-weight="700" fill="#841387">τελεστές</text>
  <text x="24" y="140" text-anchor="start" font-size="15" font-weight="700" fill="#841387">μετάβασης</text>
  <text x="250" y="268" text-anchor="middle" font-size="15" font-weight="700" fill="#0c2636">νέες καταστάσεις (παιδιά)</text>
  <text x="250" y="302" text-anchor="middle" font-size="15" font-weight="400" fill="#4a5a65">Επέκταση: παράγονται όλα τα παιδιά μιας κατάστασης.</text>
  <text x="250" y="324" text-anchor="middle" font-size="15" font-weight="400" fill="#4a5a65">Παράγοντας διακλάδωσης: πόσα είναι (εδώ 3).</text>
</svg>
