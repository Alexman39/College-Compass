  <text x="250" y="352" text-anchor="middle" font-size="14" font-weight="400" fill="#4a5a65">Αριθμοί στους δρόμους: κόστος. Πάνω από κάθε κόμβο: h.</text>
  <text x="250" y="374" text-anchor="middle" font-size="14" font-weight="400" fill="#4a5a65">Τονισμένη η φθηνότερη διαδρομή S → B → C → G, κόστος 8.</text>
