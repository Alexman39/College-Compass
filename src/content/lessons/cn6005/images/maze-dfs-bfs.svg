  <text x="258" y="674" text-anchor="start" font-size="14" font-weight="400" fill="#4a5a65">η διαδρομή που βρέθηκε</text>
  <text x="250" y="704" text-anchor="middle" font-size="15" font-weight="400" fill="#4a5a65">Σειρά κινήσεων: αριστερά, πάνω, δεξιά, κάτω.</text>
