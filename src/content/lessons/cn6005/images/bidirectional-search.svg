<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 444" width="500" height="444" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Αναζήτηση διπλής κατεύθυνσης</title>
  <defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0c2636"/></marker><marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#841387"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e7d32"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7b8a94"/></marker></defs>
  <rect width="500" height="444" fill="#ffffff"/>
  <text x="125" y="26" text-anchor="middle" font-size="17" font-weight="800" fill="#0c2636">Μία αναζήτηση</text>
  <path d="M125 50 L40 300 L210 300 Z" fill="#eef3f6" stroke="#7b8a94" stroke-width="2"/>
  <circle cx="125" cy="50" r="12" fill="#841387" stroke="#841387" stroke-width="2"/>
  <text x="125" y="55" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">S</text>
  <circle cx="170" cy="300" r="12" fill="#2e7d32" stroke="#2e7d32" stroke-width="2"/>
  <text x="170" y="305" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">G</text>
  <text x="125" y="330" text-anchor="middle" font-size="15" font-weight="400" fill="#4a5a65">μέχρι το βάθος d</text>
  <text x="125" y="356" text-anchor="middle" font-size="16" font-weight="800" fill="#0c2636">περίπου bᵈ κόμβοι</text>
  <text x="375" y="26" text-anchor="middle" font-size="17" font-weight="800" fill="#0c2636">Δύο αναζητήσεις</text>
  <path d="M375 50 L320 175 L430 175 Z" fill="#f3e6f4" stroke="#841387" stroke-width="2"/>
  <path d="M375 300 L320 175 L430 175 Z" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <circle cx="375" cy="50" r="12" fill="#841387" stroke="#841387" stroke-width="2"/>
  <text x="375" y="55" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">S</text>
  <circle cx="375" cy="300" r="12" fill="#2e7d32" stroke="#2e7d32" stroke-width="2"/>
  <text x="375" y="305" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">G</text>
  <circle cx="375" cy="175" r="9" fill="#ffffff" stroke="#0c2636" stroke-width="3"/>
  <text x="312" y="168" text-anchor="end" font-size="13" font-weight="700" fill="#0c2636">κοινή</text>
  <text x="312" y="184" text-anchor="end" font-size="13" font-weight="700" fill="#0c2636">κατάσταση</text>
  <text x="375" y="330" text-anchor="middle" font-size="15" font-weight="400" fill="#4a5a65">καθεμία μέχρι το d/2</text>
  <text x="375" y="356" text-anchor="middle" font-size="16" font-weight="800" fill="#0c2636">περίπου 2·b<tspan dy="-7" font-size="11">d/2</tspan><tspan dy="7"> κόμβοι</tspan></text>
  <line x1="20" y1="378" x2="480" y2="378" stroke="#c9d3d9" stroke-width="1.5"/>
  <text x="250" y="404" text-anchor="middle" font-size="15" font-weight="400" fill="#4a5a65">Π.χ. με b = 10 και d = 6: περίπου 1.000.000 κόμβοι</text>
  <text x="250" y="428" text-anchor="middle" font-size="15" font-weight="400" fill="#4a5a65">με μία αναζήτηση, μόλις 2.000 με δύο.</text>
</svg>
