  <text x="250" y="330" text-anchor="middle" font-size="15" font-weight="400" fill="#4a5a65">Αφετηρία η α. Τονισμένη η βέλτιστη διαδρομή</text>
  <text x="250" y="352" text-anchor="middle" font-size="15" font-weight="400" fill="#4a5a65">α → β → γ → δ → α: 3 + 5 + 5 + 3 = 16.</text>
